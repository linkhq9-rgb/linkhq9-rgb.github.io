<!DOCTYPE html>
<html>
<head>
  <title>UT/DR/UTY.win</title>

  <style>
    body {
      margin: 0;
      overflow: hidden; /* locks scrolling */
      background: black;
      font-family: monospace;
      color: #a000ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .menu {
      margin-bottom: 15px;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      background: #a000ff;
      color: white;
      text-decoration: none;
      font-size: 18px;
      border-radius: 6px;
    }

    /* 🎮 GAME WINDOW BOX */
    .game-container {
      width: 90vw;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      border: 2px solid #a000ff;
      box-shadow: 0 0 20px #a000ff55;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <div class="menu">
    <a href="mike-game.html" target="gameFrame">
      Play (for ut and dr you will need your own copy)
    </a>
  </div>

  <div class="game-container">
    <iframe name="gameFrame"></iframe>
  </div>

</body>
</html>
